name: Build Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt update
          sudo apt install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl nsis g++-mingw-w64-x86-64 mingw-w64 \
            python3 cmake

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: depends/x86_64-w64-mingw32
          key: depends-mingw-${{ hashFiles('depends/packages/*.mk') }}
          restore-keys: depends-mingw-

      - name: Build depends
        run: |
          cd depends
          find . -name "*.mk" -exec sed -i '/zeromq/d' {} \;
          make HOST=x86_64-w64-mingw32 -j$(nproc) NO_QT=1

      - name: Configure and build
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site \
          ./configure \
            --prefix=/ \
            --without-gui \
            --without-zmq \
            --disable-tests \
            --disable-bench \
            --disable-man \
            --with-wallet \
            --enable-static \
            LDFLAGS="-static-libgcc -static-libstdc++ -static"
          make -j$(nproc) sixcoind sixcoin-cli

      - name: Verify binaries
        run: |
          ls -la src/sixcoind.exe src/sixcoin-cli.exe

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            src/sixcoind.exe
            src/sixcoin-cli.exe   
